[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licenselens"
version = "1.0.0"
description = "Microsoft 365 licence and SaaS spend optimisation: find unused, overlapping and orphaned licences and track every SaaS renewal."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Olatunji Kayode Jaiyeola" }]
requires-python = ">=3.11"
keywords = ["microsoft-365", "licensing", "finops", "saas-management", "entra-id"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
licenselens = "licenselens.core.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["licenselens", "licenselens.*"]

[tool.setuptools.package-data]
"licenselens" = ["templates/*.html"]
"licenselens.core" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "B023", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["licenselens"]
